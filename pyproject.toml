[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personatrace"
version = "2.1.0"
description = "A memory layer for what is still true, what is due, and why it was stored."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stellfract-Frost" }]
keywords = [
  "memory", "llm", "mcp", "mcp-server", "agent", "user-profile",
  "long-term-memory", "temporal", "retrieval", "intentions", "sqlite",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# The belief kernel uses the standard library; the merged facade uses Pydantic.
# tzdata makes ZoneInfo work on Windows; dateutil drives weekly recurrence.
dependencies = [
  "pydantic>=2.0",
  "python-dateutil>=2.8",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
llm = ["requests>=2.28.0"]
vector = ["chromadb>=0.4.16", "sentence-transformers>=2.2.0", "numpy>=1.21.0"]
api = ["fastapi>=0.100", "uvicorn>=0.24"]
all = [
  "requests>=2.28.0",
  "chromadb>=0.4.16",
  "sentence-transformers>=2.2.0",
  "numpy>=1.21.0",
  "fastapi>=0.100",
  "uvicorn>=0.24",
]

[project.scripts]
personatrace-mcp = "personatrace.mcp_server:main"
personatrace-doctor = "personatrace.doctor:main"

[project.urls]
Homepage = "https://github.com/Stellfract-Frost/PersonaTrace"
Issues = "https://github.com/Stellfract-Frost/PersonaTrace/issues"

[tool.setuptools.packages.find]
include = ["personatrace*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [".git", ".claude", ".workbuddy", "build", "dist", "data", "persona_data", ".pytest_cache", ".pytest_tmp", "__pycache__", "*.egg-info"]
